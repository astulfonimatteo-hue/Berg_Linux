## Donations

I do not accept donations for this project.

This operating system is a personal project created with the goal of contributing to and giving something back to the community. I develop and maintain it in my free time, and I want it to remain a project made for the community, without any financial expectations.

If you find the project useful, the best way to support it is simply by using it, sharing it, reporting issues, contributing code, or helping other members of the community.

Thank you for your interest and support! 
